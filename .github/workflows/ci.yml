name: CI

on:
  pull_request:
    branches:
      - master
      - "epic/*/main"
  push:
    branches:
      - master
      - "epic/*/main"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  supabase-migrations:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if [ -d "supabase/migrations" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        if: steps.check.outputs.present == 'true'
        run: supabase start

      - name: Reset database (apply migrations)
        if: steps.check.outputs.present == 'true'
        run: supabase db reset

      - name: No migrations yet
        if: steps.check.outputs.present == 'false'
        run: echo "supabase/migrations absent, étape ignorée."
