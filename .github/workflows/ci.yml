name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno task check

      - name: Test
        run: deno task test

  supabase-migrations:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if [ -d "supabase/migrations" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        if: steps.check.outputs.present == 'true'
        run: supabase start

      - name: Reset database (apply migrations)
        if: steps.check.outputs.present == 'true'
        run: supabase db reset

      - name: Run database tests (RLS)
        if: steps.check.outputs.present == 'true'
        run: supabase test db

      - name: Edge Functions end-to-end
        if: steps.check.outputs.present == 'true'
        run: ./scripts/smoke-edge-functions.sh

      - name: No migrations yet
        if: steps.check.outputs.present == 'false'
        run: echo "supabase/migrations absent, étape ignorée."
