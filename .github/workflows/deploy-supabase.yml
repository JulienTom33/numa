name: Deploy Supabase

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging (migrations et Edge Functions)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$ALLOWED_ORIGINS" ]; then
            echo "::notice::Environnement staging non configuré (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD ou ALLOWED_ORIGINS manquant) : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Lier le projet
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations en attente (dry-run)
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --dry-run

      - name: Appliquer les migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase db push

      - name: Mettre à jour les secrets des fonctions
        if: steps.config.outputs.ready == 'true'
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

      - name: Déployer les Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  production:
    name: Production (migrations et Edge Functions)
    needs: staging
    if: needs.staging.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$ALLOWED_ORIGINS" ]; then
            echo "::notice::Environnement production non configuré (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD ou ALLOWED_ORIGINS manquant) : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Lier le projet
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations en attente (dry-run)
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --dry-run

      - name: Appliquer les migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase db push

      - name: Mettre à jour les secrets des fonctions
        if: steps.config.outputs.ready == 'true'
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

      - name: Déployer les Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
