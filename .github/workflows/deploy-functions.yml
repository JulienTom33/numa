name: Deploy Edge Functions

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

concurrency:
  group: deploy-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer les Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$ALLOWED_ORIGINS" ]; then
            echo "::notice::Projet Supabase distant non configuré (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF ou ALLOWED_ORIGINS manquant) : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Mettre à jour les secrets des fonctions
        if: steps.config.outputs.ready == 'true'
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

      - name: Déployer
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
